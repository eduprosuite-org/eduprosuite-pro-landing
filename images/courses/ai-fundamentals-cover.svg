<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="800" height="480">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    
    <!-- 3D Book Spine Gradient -->
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Gold / Accent Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <!-- Card Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="480" fill="url(#bgGrad)"/>

  <!-- Subtle Geometric Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
  </g>

  <!-- Ambient Glow Behind 3D Card -->
  <circle cx="400" cy="240" r="220" fill="#38bdf8" opacity="0.12" />

  <!-- 3D Hardcover Book / Binder Card -->
  <g filter="url(#dropShadow)">
    <!-- Book Outer Body -->
    <rect x="70" y="45" width="660" height="390" rx="18" fill="#0f172a" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
    <rect x="70" y="45" width="660" height="390" rx="18" fill="url(#bookGrad)"/>

    <!-- Left Spine Emboss -->
    <rect x="70" y="45" width="34" height="390" rx="4" fill="rgba(0,0,0,0.3)"/>
    <line x1="104" y1="45" x2="104" y2="435" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <line x1="96" y1="45" x2="96" y2="435" stroke="rgba(0,0,0,0.5)" stroke-width="1"/>
    
    <!-- Top Header Ribbon -->
    <rect x="130" y="80" width="220" height="30" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="142" y="100" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="11" font-weight="800" fill="#bae6fd" letter-spacing="1.5">
      ✓ PROFESSIONAL FLUENCY
    </text>

    <!-- Star Rating & Trust Badge -->
    <g transform="translate(560, 85)">
      <text x="0" y="16" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#facc15">★★★★★</text>
      <text x="75" y="16" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#94a3b8">4.9/5</text>
    </g>

    <!-- Main Course Title -->
    <text x="130" y="175" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      AI FUNDAMENTALS
    </text>

    <!-- Subtitle / Exam Modules -->
    <text x="130" y="215" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#38bdf8">
      LLMs, Prompt Engineering, RAG & Fluency
    </text>

    <!-- Thin Divider -->
    <line x1="130" y1="245" x2="680" y2="245" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

    <!-- 3 Pill Modules -->
    <g transform="translate(130, 270)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="38" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="14" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">🎯 25 Full Mock Tests</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="175" height="38" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="194" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">🧠 500+ Flashcards</text>

      <!-- Pill 3 -->
      <rect x="370" y="0" width="175" height="38" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <text x="384" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">📑 Printable Sheets</text>
    </g>

    <!-- Bottom Brand Bar -->
    <g transform="translate(130, 360)">
      <rect x="0" y="0" width="24" height="24" rx="6" fill="#2563eb"/>
      <text x="6" y="17" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="900" fill="#ffffff">E</text>
      <text x="34" y="17" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="800" fill="#ffffff">EduPro Suite</text>
      <text x="145" y="17" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#64748b">• #1 High-Yield Exam Preparation Vault</text>
    </g>

    <!-- Gold 100% Pass Seal -->
    <g transform="translate(620, 330)">
      <circle cx="35" cy="35" r="32" fill="#38bdf8" opacity="0.15" stroke="#38bdf8" stroke-width="2"/>
      <text x="35" y="30" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#38bdf8" text-anchor="middle">100% PASS</text>
      <text x="35" y="44" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">GUARANTEE</text>
    </g>
  </g>
</svg>