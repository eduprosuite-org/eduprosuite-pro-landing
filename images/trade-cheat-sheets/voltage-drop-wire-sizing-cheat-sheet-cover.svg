  <line x1="95" y1="850" x2="1505" y2="850" stroke="#334155" stroke-width="1.5" />
  <text x="95" y="895" font-family="'Inter', sans-serif" font-size="18" font-weight="800" fill="#ffffff">EDUPROSUITE.PRO</text>
  <text x="1505" y="895" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#eab308" text-anchor="end">2026 FIELD MANUAL EDITION</text>
