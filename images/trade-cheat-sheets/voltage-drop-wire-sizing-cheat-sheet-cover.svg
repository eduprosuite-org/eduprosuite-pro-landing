    <text x="20" y="29" font-family="'Inter', sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">⚡ Heavy-Duty Formula Wheel</text>

    <rect x="300" y="0" width="280" height="46" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="320" y="29" font-family="'Inter', sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">⚠️ Code Pitfall Traps (NEC/EPA)</text>

    <rect x="600" y="0" width="280" height="46" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <text x="620" y="29" font-family="'Inter', sans-serif" font-size="14.5" font-weight="700" fill="#f8fafc">📐 Pocket Sized &amp; Laminated</text>
  </g>

  <!-- Technical Schematic Mockup Box -->
  <rect x="95" y="520" width="1410" height="270" rx="10" fill="#030712" fill-opacity="0.85" stroke="#374151" stroke-width="2" />
  
  <rect x="95" y="520" width="1410" height="42" rx="10" fill="#111827" />
  <circle cx="125" cy="541" r="5" fill="#ef4444" />
  <circle cx="143" cy="541" r="5" fill="#f59e0b" />
  <circle cx="161" cy="541" r="5" fill="#10b981" />
  <text x="185" y="547" font-family="'Courier New', monospace" font-size="14" fill="#9ca3af">trade_specifications_field_formula.dat</text>

