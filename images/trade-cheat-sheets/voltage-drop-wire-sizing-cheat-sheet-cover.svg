  <text x="135" y="103" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="15" font-weight="800" fill="#f8fafc" letter-spacing="2">EDUPRO TRADES · FIELD MANUAL</text>

  <!-- Trade Category & Verification Tag -->
