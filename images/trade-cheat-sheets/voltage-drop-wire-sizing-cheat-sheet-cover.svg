<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="hazardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <!-- Hazard Stripes for Field Manual Texture -->
    <pattern id="stripes" width="30" height="30" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="30" stroke="#eab308" stroke-width="6" stroke-opacity="0.12" />
    </pattern>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="rgba(255,255,255,0.06)" />
    </pattern>
  </defs>

  <!-- Heavy Duty Background -->
  <rect width="1600" height="1000" fill="url(#bgGrad)" />
  <rect width="1600" height="1000" fill="url(#dotGrid)" />
  
  <!-- Left Side Industrial Hazard Strip -->
  <rect x="0" y="0" width="36" height="1000" fill="url(#stripes)" />
  <line x1="36" y1="0" x2="36" y2="1000" stroke="#eab308" stroke-width="2" stroke-opacity="0.5" />

  <!-- Outer Technical Perimeter Frame -->
  <rect x="65" y="45" width="1490" height="910" fill="none" stroke="#eab308" stroke-opacity="0.3" stroke-width="2" rx="8" />

