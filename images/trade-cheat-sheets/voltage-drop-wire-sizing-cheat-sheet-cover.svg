  <!-- Title (Heavy Sans-Serif, High Contrast for Mobile Thumbnails) -->
  <text x="95" y="270" font-family="'Space Grotesk', 'Impact', sans-serif" font-size="54" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    VOLTAGE DROP & NEC CONDUCTOR SIZING CH
  </text>
  <text x="95" y="345" font-family="'Space Grotesk', 'Impact', sans-serif" font-size="54" font-weight="900" fill="url(#hazardGrad)" letter-spacing="-0.5">
